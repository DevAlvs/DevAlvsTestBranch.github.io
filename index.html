<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juegos - Acceso Protegido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-login:hover {
            transform: scale(1.02);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }

        /* Estilos para la página de juegos */
        .games-container {
            display: none;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .games-content {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }

        .games-content h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .game-button {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .game-button:hover {
            transform: scale(1.05);
        }

        .game-button:active {
            transform: scale(0.95);
        }

        /* Estilos para el reproductor de video */
        .video-container {
            display: none;
            width: 100%;
            height: 100vh;
            background: #000;
            justify-content: center;
            align-items: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .exit-video {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
        }

        .exit-video:hover {
            background: #ddd;
        }
    </style>
</head>
<body>

    <!-- Pantalla de login -->
    <div class="login-container" id="loginContainer">
        <h1>🎮 Juegos</h1>
        <form id="loginForm" onsubmit="checkPassword(event)">
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingresa la contraseña" required>
            </div>
            <button type="submit" class="btn-login">Acceder</button>
        </form>
        <div class="error-message" id="errorMessage">❌ Contraseña incorrecta</div>
    </div>

    <!-- Pantalla de juegos -->
    <div class="games-container" id="gamesContainer">
        <div class="games-content">
            <h2>🎮 Selecciona un Juego</h2>
            <button class="game-button" onclick="playGame()">▶️ Jugar</button>
            <button class="game-button" onclick="logout()">🚪 Salir</button>
        </div>
    </div>

    <!-- Contenedor de video -->
    <div class="video-container" id="videoContainer">
        <button class="exit-video" onclick="exitFullscreen()">✕ Salir</button>
        <video id="gameVideo" controls>
            <source src="https://rr1---sn-h5q7knee.googlevideo.com/videoplayback?expire=1780591572&ei=dFchatalFpiO-LAP4rzxmQ4&ip=108.165.63.130&id=o-AHAqzOVHnV5uh31M6AANor9jiYG_RpXyC0IfRydqemNK&itag=18&source=youtube&requiressl=yes&xpc=EgVo2aDSNQ%3D%3D&cps=121&bui=AbKmrwobKsN_NU5EkER2JSRS3sxWWf2drVAsKmDr8jf5usBeMP88mxMih3V1q8uauM4dIPMZ9UqU1i7_&spc=96Xrv2l9jHdw2NMAukXJEhuRUCZoke-ttRgmfjCffcEcnQoTBcUsBitV9ytSOeM2iC4&vprv=1&svpuc=1&mime=video%2Fmp4&rqh=1&cnr=14&ratebypass=yes&dur=426.527&lmt=1732483565884050&fexp=51565115,51565682&c=ANDROID&txp=1438434&sparams=expire%2Cei%2Cip%2Cid%2Citag%2Csource%2Crequiressl%2Cxpc%2Cbui%2Cspc%2Cvprv%2Csvpuc%2Cmime%2Crqh%2Ccnr%2Cratebypass%2Cdur%2Clmt&sig=AHEqNM4wRQIgQJXGAbeP7kcoUGhrbUSIbQUIFd1KtfNue2Z-uUJezmACIQDgWqaCceV_zxGV8RLuejfyV2u8S6QfixnZkN-RTTDwag%3D%3D&rm=sn-5obva5j5caxn-4vge7l,sn-gpvse7l&rrc=79,104&req_id=842493676d36a3ee&cmsv=e&rms=rdu,au&redirect_counter=2&cms_redirect=yes&ipbypass=yes&met=1780569977,&mh=c3&mip=46.28.160.200&mm=29&mn=sn-h5q7knee&ms=rdu&mt=1780569375&mv=u&mvi=1&pl=24&lsparams=cps,ipbypass,met,mh,mip,mm,mn,ms,mv,mvi,pl,rms&lsig=APaTxxMwRQIgM3fqn3NWXEAb3MXkNq5twsycP8kO6-YxtEhnrfjA2DoCIQCszLYKEH7h85KzhdDFUySuHtaovoVlVq-FEHrEY_ykgA%3D%3D" type="video/mp4">
            Tu navegador no soporta el elemento de video.
        </video>
    </div>

    <script>
        const correctPassword = "1234";
        const loginContainer = document.getElementById("loginContainer");
        const gamesContainer = document.getElementById("gamesContainer");
        const videoContainer = document.getElementById("videoContainer");
        const gameVideo = document.getElementById("gameVideo");
        const errorMessage = document.getElementById("errorMessage");

        function checkPassword(event) {
            event.preventDefault();
            const passwordInput = document.getElementById("password");
            const password = passwordInput.value;

            if (password === correctPassword) {
                errorMessage.style.display = "none";
                loginContainer.style.display = "none";
                gamesContainer.style.display = "flex";
                passwordInput.value = "";
            } else {
                errorMessage.style.display = "block";
                passwordInput.value = "";
                passwordInput.focus();
            }
        }

        function playGame() {
            // Subir volumen
            gameVideo.volume = 1;

            // Pantalla completa
            if (videoContainer.requestFullscreen) {
                videoContainer.requestFullscreen().catch(err => {
                    console.log("Error al entrar en pantalla completa:", err);
                });
            } else if (videoContainer.webkitRequestFullscreen) {
                videoContainer.webkitRequestFullscreen();
            } else if (videoContainer.mozRequestFullScreen) {
                videoContainer.mozRequestFullScreen();
            } else if (videoContainer.msRequestFullscreen) {
                videoContainer.msRequestFullscreen();
            }

            // Mostrar video
            gamesContainer.style.display = "none";
            videoContainer.style.display = "flex";

            // Reproducir video
            gameVideo.play();
        }

        function exitFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else if (document.webkitFullscreenElement) {
                document.webkitExitFullscreen();
            } else if (document.mozFullScreenElement) {
                document.mozCancelFullScreen();
            } else if (document.msFullscreenElement) {
                document.msExitFullscreen();
            }

            videoContainer.style.display = "none";
            gamesContainer.style.display = "flex";
            gameVideo.pause();
        }

        function logout() {
            gamesContainer.style.display = "none";
            loginContainer.style.display = "flex";
            document.getElementById("password").focus();
        }

        // Permitir salir de pantalla completa con ESC
        document.addEventListener("fullscreenchange", function() {
            if (!document.fullscreenElement) {
                exitFullscreen();
            }
        });

        // Permitir salir con la tecla ESC
        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape" && videoContainer.style.display === "flex") {
                exitFullscreen();
            }
        });
    </script>

</body>
</html>
